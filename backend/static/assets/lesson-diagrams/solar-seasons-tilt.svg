  <g stroke="url(#ray)" stroke-width="11" stroke-linecap="round">
    <line x1="236" y1="230" x2="560" y2="230"/>
    <line x1="236" y1="280" x2="560" y2="280"/>
    <line x1="236" y1="330" x2="560" y2="330"/>
  </g>

  <path d="M560 146a190 190 0 0 1 220 0" fill="none" stroke="#90b7ff" stroke-width="3"/>
  <path d="M780 146l-20-4 10 16z" fill="#90b7ff"/>

  <text x="114" y="288" fill="#eef1f8" font-size="26" font-weight="700" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">太阳</text>
  <text x="632" y="289" fill="#eef4ff" font-size="26" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">地球</text>
  <text x="706" y="390" fill="#eaf1ff" font-size="26" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">地轴倾角 θ</text>

