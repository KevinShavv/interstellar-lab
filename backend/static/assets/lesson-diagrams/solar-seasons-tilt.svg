<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <defs>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe7a2" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffe7a2" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="sunBody" cx="34%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#fff6c8"/>
