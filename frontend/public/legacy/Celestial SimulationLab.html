<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&#x661F;&#x4F53;&#x5B9E;&#x9A8C;&#x5BA4;</title>
    <link rel="stylesheet" href="/assets/simulation/styles/deepseek-widget.css" />
    <script src="/assets/simulation/chat/deepseek-widget.js" defer></script>
    <script src="/assets/simulation/three.min.js"></script>
    <script src="/assets/simulation/OrbitControls.min.js"></script>
    <script src="/assets/simulation/GLTFLoader.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: "微软雅黑", "Arial", sans-serif;
        }
        
        .scene-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        
        #sidebar-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: rgba(30, 40, 80, 0.55);
            border-right: 2px solid rgba(60, 80, 180, 0.18);
            z-index: 1200;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            backdrop-filter: blur(18px) saturate(160%);
            border-radius: 0 24px 24px 0;
            transition: background 0.4s, box-shadow 0.4s, left 0.4s, width 0.4s;
            overflow: hidden;
            max-width: 95vw;
            min-width: 40px;
        }
        #sidebar-panel.collapsed {
            left: 0;
            width: 40px;
            min-width: 40px;
            padding: 0;
            border-radius: 0 16px 16px 0;
            overflow: visible;
        }
        #sidebar-panel .sidebar-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: 18px 10px 10px 10px;
            scrollbar-width: thin;
            scrollbar-color: #6a11cb rgba(255,255,255,0.08);
        }
        
        #sidebar-panel .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }
        
        #sidebar-panel .sidebar-content::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
        }
        
        #sidebar-panel .sidebar-content::-webkit-scrollbar-thumb {
            background: #6a11cb;
            border-radius: 3px;
        }
        #sidebar-panel.collapsed .sidebar-content {
            display: none !important;
        }
        #sidebar-toggle-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 28px;
            height: 28px;
            background: rgba(37,117,252,0.85);
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1300;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(37,117,252,0.13);
            transition: background 0.3s;
        }
        #sidebar-panel.collapsed #sidebar-toggle-btn {
            left: 6px;
            top: 6px;
        }
        #sidebar-toggle-btn:hover {
            background: #6a11cb;
        }
        
        #sidebar-panel h4 {
            color: #fff;
            font-size: 20px;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 4px 12px rgba(0,0,0,0.25);
            font-family: 'Segoe UI', '微软雅黑', Arial, sans-serif;
        }
        
        #sidebar-panel input[type="text"],
        #sidebar-panel input[type="number"] {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1.5px solid rgba(80,120,255,0.18);
            border-radius: 8px;
            margin-bottom: 8px;
            padding: 8px 12px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 6px rgba(80,120,255,0.08);
        }
        
        #sidebar-panel input[type="text"]:focus,
        #sidebar-panel input[type="number"]:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.18);
        }
        
        #sidebar-panel input[type="color"] {
            border: none;
            background: transparent;
            padding: 0;
            width: 100%;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        #sidebar-panel select {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1.5px solid rgba(80,120,255,0.18);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(80,120,255,0.08);
        }
        
        #sidebar-panel button {
            margin-top: 6px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(.4,2,.6,1);
            border-radius: 12px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(106, 17, 203, 0.18);
        }
        
        #sidebar-panel button:hover {
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 8px 24px rgba(106, 17, 203, 0.22);
        }
        
        #sidebar-panel button:active {
            transform: scale(0.98);
        }
        
        #simulate-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%) !important;
            font-size: 15px !important;
            font-weight: bold !important;
            letter-spacing: 1px;
            margin-top: 16px !important;
            padding: 10px 16px !important;
            box-shadow: 0 3px 10px rgba(40, 167, 69, 0.4) !important;
        }
        
        #simulate-btn:hover {
            background: linear-gradient(135deg, #20c997 0%, #28a745 100%) !important;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.5) !important;
        }
        
        #simulate-btn.simulating {
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%) !important;
            box-shadow: 0 3px 10px rgba(220, 53, 69, 0.4) !important;
        }
        
        #simulate-btn.simulating:hover {
            background: linear-gradient(135deg, #fd7e14 0%, #dc3545 100%) !important;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5) !important;
        }
        
        #planet-list {
            margin-top: 12px;
            max-height: 180px;
            overflow-y: auto;
            color: #eee;
            font-size: 14px;
            scrollbar-width: thin;
            scrollbar-color: #6a11cb rgba(255,255,255,0.08);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
        }
        
        /* 紧凑模式 - 当星体数量多�?*/
        #planet-list.compact {
            max-height: 140px;
            font-size: 13px;
        }
        
        #planet-list.compact .planet-item {
            margin-bottom: 4px;
            padding: 6px 10px;
        }
        
        #planet-list.compact .planet-name {
            font-size: 13px;
        }
        
        #planet-list.compact .delete-btn {
            padding: 3px 8px !important;
            font-size: 11px !important;
        }
        
        #planet-list::-webkit-scrollbar {
            width: 8px;
        }
        
        #planet-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
        }
        
        #planet-list::-webkit-scrollbar-thumb {
            background: #6a11cb;
            border-radius: 4px;
        }
        
        #three-container {
            position: absolute;
            left: 280px;
            top: 0;
            right: 0;
            bottom: 0;
        }
        
        .section-divider {
            border: 0;
            border-top: 1px solid rgba(51, 68, 102, 0.7);
            margin: 12px 0;
        }
        
        .section-label {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            display: block;
        }
        
        .input-group {
            margin-bottom: 12px;
        }
        
        .planet-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            transition: background 0.25s;
            box-shadow: 0 1px 4px rgba(106, 17, 203, 0.06);
        }
        
        .planet-item:hover {
            background: rgba(106, 17, 203, 0.13);
            box-shadow: 0 4px 16px rgba(106, 17, 203, 0.13);
        }
        
        .planet-name {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
            user-select: none;
        }
        
        .planet-name:hover {
            color: #6a11cb;
            text-shadow: 0 0 8px rgba(106, 17, 203, 0.5);
        }
        
        .delete-btn {
            padding: 4px 10px !important;
            font-size: 12px !important;
            margin: 0 !important;
            background: linear-gradient(135deg, #fd7e14 0%, #dc3545 100%) !important;
            border-radius: 6px !important;
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(220, 53, 69, 0.13) !important;
        }
        
        .delete-btn:hover {
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%) !important;
            box-shadow: 0 4px 16px rgba(220, 53, 69, 0.18) !important;
        }
        
        .drag-hint {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 40, 80, 0.55);
            color: #fff;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 16px;
            z-index: 1000;
            backdrop-filter: blur(18px) saturate(160%);
            border: 1.5px solid rgba(80,120,255,0.18);
            box-shadow: 0 4px 16px rgba(106, 17, 203, 0.13);
            font-weight: 500;
        }
        
        @media (max-width: 800px) {
            #sidebar-panel {
                width: 220px;
            }
            #sidebar-panel.collapsed {
                left: -200px;
                width: 40px;
            }
            #three-container {
                left: 220px;
            }
        }
        
        @media (max-width: 600px) {
            #sidebar-panel {
                width: 100vw;
                height: 220px;
                bottom: 0;
                top: auto;
                left: 0;
                border-radius: 0 0 24px 24px;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                max-width: 100vw;
            }
            #sidebar-panel.collapsed {
                left: 0;
                width: 40px;
                min-width: 40px;
                height: 40px;
                border-radius: 0 0 16px 16px;
            }
            #three-container {
                left: 0;
                bottom: 220px;
            }
            .drag-hint {
                top: auto;
                bottom: 220px;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/simulation/styles/celestial-lab.css" />
</head>
<body>
    <div class="scene-transition" id="scene-transition"></div>
    <div class="lab-shell">
        <div id="sidebar-panel">
            <div class="sidebar-content">
                <div class="section-card section-card--controls">
                    <div class="section-card__header">
                        <label class="section-label">系统控制</label>
                    </div>
                    <div class="button-row button-row--controls">
                        <button id="change-g-btn">引力 G</button>
                        <button id="toggle-names-btn">名称</button>
                    </div>
                    <div class="button-row button-row--single">
                        <button id="toggle-trajectories-btn">轨迹</button>
                    </div>
                </div>
                
                <div class="section-card section-card--scale">
                    <div class="input-group input-group--compact">
                        <div class="section-card__header">
                            <label class="section-label">天体尺度</label>
                        </div>
                        <div class="scale-control-row">
                            <input id="radius-scale-input" type="number" min="0.01" max="10" step="0.01" value="1" />
                            <button id="apply-radius-scale-btn">应用</button>
                        </div>
                    </div>
                </div>
                
                <div class="section-card section-card--add">
                    <div class="input-group input-group--compact">
                        <div class="section-card__header">
                            <label class="section-label">添加星体</label>
                        </div>
                        <div class="button-row button-row--actions">
                            <button id="add-custom-planet-btn">自定义</button>
                            <button id="add-default-planet-btn">默认</button>
                        </div>
                    </div>
                </div>
                
                <div class="section-card section-card--list">
                    <div class="section-card__header">
                        <label class="section-label">已添加星体 <span id="planet-count">(0个)</span></label>
                    </div>
                    <div id="planet-list"></div>
                </div>
                
                <div class="section-card section-card--cta">
                    <button id="simulate-btn">开始模拟</button>
                </div>
            </div>
        </div>
        
        <div id="three-container"></div>
    </div>

    <div id="time-control-panel">
        <span id="time-label">时间流逝速度: 1x</span>
        <input id="time-slider" type="range" min="0.1" max="100" step="0.1" value="1" />
        <small class="time-note">拖动滑块可加速或减慢系统演化</small>
    </div>


    


    <script src="/assets/simulation/celestial-lab-logic.js"></script>
    <script src="/assets/simulation/legacy-i18n.js"></script>

</body>
</html>
