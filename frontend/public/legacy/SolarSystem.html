    <script>
        // 主要变量声明

        let moonAngle = Math.random() * Math.PI * 2;
        // 仿真日期追踪
        let simDate = new Date();
        let simDateEl = null;
        let followTarget = "地球";
        let followDistance = 12; // 跟随距离，可根据实际调整
        let followElevation = 0.2; // 跟随高度，几乎平视行星
        let followAzimuth = Math.PI/4; // 跟随视角方位
        let isTransitioning = false; // 是否正在视角过渡
        let transitionStartTime = 0; // 过渡开始时间
        let transitionDuration = 1000; // 过渡持续时间(ms)
        let originalCameraPos = new THREE.Vector3(); // 原始相机位置
        let originalControlsTarget = new THREE.Vector3(); // 原始控制目标
        const solarPerfProfile = (() => {
            const viewportWidth = window.innerWidth || 1920;
            const dpr = window.devicePixelRatio || 1;
            const isHeavyDevice = dpr > 1.5 || viewportWidth < 1280;
            return {
                isHeavyDevice,
                pixelRatioCap: isHeavyDevice ? 1.0 : 1.12,
                asteroidCount: isHeavyDevice ? 560 : 760,
                dustCount: isHeavyDevice ? 1200 : 1800,
                trailUpdateFrameInterval: isHeavyDevice ? 3 : 2,
                asteroidUpdateFrameInterval: isHeavyDevice ? 2 : 1,
                labelUpdateIntervalMs: isHeavyDevice ? 84 : 58
            };
        })();
        let solarFrameCount = 0;
        let lastSolarLabelUpdate = 0;

        // 地轴倾角（黄赤交角）— 国际天文联合会 IAU 标准值
        const EARTH_AXIAL_TILT_DEG = 23.439281;
        const EARTH_AXIAL_TILT = EARTH_AXIAL_TILT_DEG * Math.PI / 180;

        // 行星配置（对数缩放/适度缩放）
        // 真实半径（单位：km）
        const realRadius = {
            "太阳": 696340,
            "水星": 2439.7,
            "金星": 6051.8,
            "地球": 6371,
            "火星": 3389.5,
            "木星": 69911,
            "土星": 58232,
            "天王星": 25362,
            "海王星": 24622,
            "月球": 1737.1 // 新增月球真实半径
        };
        // 真实轨道半径（单位：百万km，日均距离）
        const realDistance = {
            "\u6c34\u661f": 57.9,
            "\u91d1\u661f": 108.2,
            "\u5730\u7403": 149.6,
            "\u706b\u661f": 227.9,
            "\u6728\u661f": 778.6,
            "\u571f\u661f": 1433.5,
            "\u5929\u738b\u661f": 2872.5,
            "\u6d77\u738b\u661f": 4495.1,
            "\u6708\u7403": 0.384
        };
        const sizeScale = 0.1;
        const distanceScale = 10;
        const distanceGapScale = 1.4;
        function logScale(val, base = 10) {
            return Math.log(val) / Math.log(base);
        }
        const realEccentricity = {
            "\u6c34\u661f": 0.2056,
            "\u91d1\u661f": 0.0068,
            "\u5730\u7403": 0.0167,
            "\u706b\u661f": 0.0934,
            "\u6728\u661f": 0.0489,
            "\u571f\u661f": 0.0565,
            "\u5929\u738b\u661f": 0.0457,
            "\u6d77\u738b\u661f": 0.0113,
            "\u6708\u7403": 0.0549
        };
        const realInclination = {
            "\u6c34\u661f": 7.005,
            "\u91d1\u661f": 3.39458,
            "\u5730\u7403": 0,
            "\u706b\u661f": 1.850,
            "\u6728\u661f": 1.303,
            "\u571f\u661f": 2.485,
            "\u5929\u738b\u661f": 0.773,
            "\u6d77\u738b\u661f": 1.770,
            "\u6708\u7403": 5.145
        };
        const realAscendingNode = {
            "\u6c34\u661f": 48.331,
            "\u91d1\u661f": 76.680,
            "\u5730\u7403": 0,
            "\u706b\u661f": 49.558,
            "\u6728\u661f": 100.464,
            "\u571f\u661f": 113.665,
            "\u5929\u738b\u661f": 74.006,
            "\u6d77\u738b\u661f": 131.784,
            "\u6708\u7403": 125.080
        };
        const realArgumentOfPeriapsis = {
            "\u6c34\u661f": 29.124,
            "\u91d1\u661f": 54.884,
            "\u5730\u7403": 102.937,
            "\u706b\u661f": 286.502,
            "\u6728\u661f": 273.867,
            "\u571f\u661f": 339.392,
            "\u5929\u738b\u661f": 96.998,
            "\u6d77\u738b\u661f": 273.187,
            "\u6708\u7403": 318.150
        };
        const orbitDistanceReference = logScale(realDistance["\u6d77\u738b\u661f"]) * distanceScale + 400 * distanceGapScale;
        const orbitDistanceScale = orbitDistanceReference / realDistance["\u6d77\u738b\u661f"];
        function degreesToRadians(value) {
            return value * Math.PI / 180;
        }
        function getRealScaledOrbitDistance(name) {
            return realDistance[name] * orbitDistanceScale;
        }
        function getOrbitPlane(name) {
            return {
                inclination: degreesToRadians(realInclination[name] || 0),
                ascendingNode: degreesToRadians(realAscendingNode[name] || 0),
                argumentOfPeriapsis: degreesToRadians(realArgumentOfPeriapsis[name] || 0)
            };
        }
        function applyOrbitPlane(point, orbitPlane) {
            return point
                .clone()
                .applyAxisAngle(new THREE.Vector3(0, 1, 0), orbitPlane.argumentOfPeriapsis)
                .applyAxisAngle(new THREE.Vector3(1, 0, 0), orbitPlane.inclination)
                .applyAxisAngle(new THREE.Vector3(0, 1, 0), orbitPlane.ascendingNode);
        }
        function getOrbitPoint(cfg, angle) {
            const a = cfg.distance;
            const e = cfg.eccentricity || 0;
            const b = a * Math.sqrt(1 - e * e);
            const orbitalPoint = new THREE.Vector3(
                a * Math.cos(angle) - a * e,
                0,
                b * Math.sin(angle)
            );
            return applyOrbitPlane(orbitalPoint, cfg.orbitPlane || getOrbitPlane(cfg.name));
        }
        // ★ 复用 Vector3 避免每帧 GC
        const _orbitWorkVec = new THREE.Vector3();
        const _orbitAxisVec = new THREE.Vector3();
        function getOrbitPointFast(cfg, angle, out) {
            const a = cfg.distance;
            const e = cfg.eccentricity || 0;
            const b = a * Math.sqrt(1 - e * e);
            out.set(
                a * Math.cos(angle) - a * e,
                0,
                b * Math.sin(angle)
            );
            const plane = cfg.orbitPlane || getOrbitPlane(cfg.name);
            _orbitAxisVec.set(1, 0, 0);
            out.applyAxisAngle(_orbitAxisVec.set(0, 1, 0), plane.argumentOfPeriapsis);
            out.applyAxisAngle(_orbitAxisVec.set(1, 0, 0), plane.inclination);
            out.applyAxisAngle(_orbitAxisVec.set(0, 1, 0), plane.ascendingNode);
            return out;
        }
        const planetConfig = {
            "\u592a\u9633":   { name: "\u592a\u9633", distance: 0,  size: logScale(realRadius["\u592a\u9633"]) * sizeScale * 4, speed: 0, rotationSpeed: 0.001, color: 0xffde21, model: "/assets/simulation/models/sun.glb" },
            "\u6c34\u661f":   { name: "\u6c34\u661f", distance: getRealScaledOrbitDistance("\u6c34\u661f"), size: logScale(realRadius["\u6c34\u661f"]) * sizeScale, speed: 0.07142418, rotationSpeed: 0.107137, color: 0xb5b5b5, model: "/assets/simulation/models/mercury.glb", eccentricity: realEccentricity["\u6c34\u661f"], orbitColor: 0xaaaaaa, orbitPlane: getOrbitPlane("\u6c34\u661f") },
            "\u91d1\u661f":   { name: "\u91d1\u661f", distance: getRealScaledOrbitDistance("\u91d1\u661f"), size: logScale(realRadius["\u91d1\u661f"]) * sizeScale, speed: 0.02796255, rotationSpeed: 0.025854, color: 0xeccc9a, model: "/assets/simulation/models/venus.glb", eccentricity: realEccentricity["\u91d1\u661f"], orbitColor: 0xffe4b5, orbitPlane: getOrbitPlane("\u91d1\u661f") },
            "\u5730\u7403":   { name: "\u5730\u7403", distance: getRealScaledOrbitDistance("\u5730\u7403"), size: logScale(realRadius["\u5730\u7403"]) * sizeScale, speed: 0.01720242, rotationSpeed: 6.283185, color: 0x3399ff, model: "/assets/simulation/models/earth.glb", eccentricity: realEccentricity["\u5730\u7403"], orbitColor: 0x3399ff, orbitPlane: getOrbitPlane("\u5730\u7403") },
            "\u6708\u7403":   { name: "\u6708\u7403", distance: logScale(realDistance["\u6708\u7403"]) * 2.2, size: logScale(realRadius["\u6708\u7403"]) * sizeScale * 0.5, speed: 0.22996799, rotationSpeed: 0.229968, color: 0xcccccc, model: "/assets/simulation/models/moon.glb", parent: "\u5730\u7403", eccentricity: realEccentricity["\u6708\u7403"], orbitColor: 0x888888, orbitPlane: getOrbitPlane("\u6708\u7403") },
            "\u706b\u661f":   { name: "\u706b\u661f", distance: getRealScaledOrbitDistance("\u706b\u661f"), size: logScale(realRadius["\u706b\u661f"]) * sizeScale, speed: 0.00914610, rotationSpeed: 6.123962, color: 0xff6633, model: "/assets/simulation/models/mars.glb", eccentricity: realEccentricity["\u706b\u661f"], orbitColor: 0xff6347, orbitPlane: getOrbitPlane("\u706b\u661f") },
            "\u6728\u661f":   { name: "\u6728\u661f", distance: getRealScaledOrbitDistance("\u6728\u661f"), size: logScale(realRadius["\u6728\u661f"]) * sizeScale, speed: 0.00145021, rotationSpeed: 15.195128, color: 0xffcc99, model: "/assets/simulation/models/jupiter.glb", eccentricity: realEccentricity["\u6728\u661f"], orbitColor: 0xf5deb3, orbitPlane: getOrbitPlane("\u6728\u661f") },
            "\u571f\u661f":   { name: "\u571f\u661f", distance: getRealScaledOrbitDistance("\u571f\u661f"), size: logScale(realRadius["\u571f\u661f"]) * sizeScale * 10, speed: 0.00058398, rotationSpeed: 14.151318, color: 0xffe599, model: "/assets/simulation/models/saturn.glb", eccentricity: realEccentricity["\u571f\u661f"], orbitColor: 0xffe599, orbitPlane: getOrbitPlane("\u571f\u661f") },
            "\u5929\u738b\u661f": { name: "\u5929\u738b\u661f", distance: getRealScaledOrbitDistance("\u5929\u738b\u661f"), size: logScale(realRadius["\u5929\u738b\u661f"]) * sizeScale, speed: 0.00020474, rotationSpeed: 8.750954, color: 0x99ffff, model: "/assets/simulation/models/uranus.glb", eccentricity: realEccentricity["\u5929\u738b\u661f"], orbitColor: 0x66ffff, orbitPlane: getOrbitPlane("\u5929\u738b\u661f") },
            "\u6d77\u738b\u661f": { name: "\u6d77\u738b\u661f", distance: getRealScaledOrbitDistance("\u6d77\u738b\u661f"), size: logScale(realRadius["\u6d77\u738b\u661f"]) * sizeScale, speed: 0.00010440, rotationSpeed: 9.363913, color: 0x3366ff, model: "/assets/simulation/models/neptune.glb", eccentricity: realEccentricity["\u6d77\u738b\u661f"], orbitColor: 0x3366ff, orbitPlane: getOrbitPlane("\u6d77\u738b\u661f") }
        };

        const asteroidBeltConfig = {
            innerDistance: 329.1 * orbitDistanceScale,
            outerDistance: 478.7 * orbitDistanceScale,
            count: solarPerfProfile.asteroidCount
        };

        function getAsteroidBeltPoint(body) {
            const point = new THREE.Vector3(
                body.radius * Math.cos(body.angle),
                0,
                body.radius * Math.sin(body.angle)
            );
            point.applyAxisAngle(new THREE.Vector3(1, 0, 0), body.inclination);
            point.applyAxisAngle(new THREE.Vector3(0, 1, 0), body.ascendingNode);
            point.y += Math.sin(body.angle * body.verticalFrequency + body.verticalPhase) * body.verticalAmplitude;
            return point;
        }

        // ★ 复用 Vector3 避免小行星带每帧 GC
        const _beltWorkVec = new THREE.Vector3();
        function updateAsteroidBelt(delta, elapsedTime) {
            if (!asteroidBelt || asteroidBeltBodies.length === 0) return;

            for (let i = 0; i < asteroidBeltBodies.length; i++) {
                const body = asteroidBeltBodies[i];
                body.angle += body.speed * delta * 60;

                const position = getAsteroidBeltPointFast(body, _beltWorkVec);
                asteroidTransform.position.copy(position);
                asteroidTransform.rotation.set(
                    body.spinX + elapsedTime * body.spinSpeed * 0.65,
                    body.spinY + elapsedTime * body.spinSpeed,
                    body.spinZ + elapsedTime * body.spinSpeed * 0.45
                );
                asteroidTransform.scale.setScalar(body.size);
                asteroidTransform.updateMatrix();
                asteroidBelt.setMatrixAt(i, asteroidTransform.matrix);
            }

            asteroidBelt.instanceMatrix.needsUpdate = true;
        }
        function getAsteroidBeltPointFast(body, out) {
            out.set(
                body.radius * Math.cos(body.angle),
                0,
                body.radius * Math.sin(body.angle)
            );
            out.applyAxisAngle(_orbitAxisVec.set(1, 0, 0), body.inclination);
            out.applyAxisAngle(_orbitAxisVec.set(0, 1, 0), body.ascendingNode);
            out.y += Math.sin(body.angle * body.verticalFrequency + body.verticalPhase) * body.verticalAmplitude;
            return out;
        }

        function createAsteroidBelt() {
            asteroidBeltBodies = [];

            if (asteroidBelt) {
                scene.remove(asteroidBelt);
                asteroidBelt.geometry.dispose();
                asteroidBelt.material.dispose();
            }

            if (asteroidBeltDust) {
                scene.remove(asteroidBeltDust);
                asteroidBeltDust.geometry.dispose();
                asteroidBeltDust.material.dispose();
                asteroidBeltDust = null;
            }

            const geometry = new THREE.IcosahedronGeometry(1, 0);
            const material = new THREE.MeshStandardMaterial({
                color: 0xc7b298,
                roughness: 0.97,
                metalness: 0.01,
                emissive: 0x17110b,
                emissiveIntensity: 0.15,
                vertexColors: true
            });

            asteroidBelt = new THREE.InstancedMesh(geometry, material, asteroidBeltConfig.count);
            if (THREE.DynamicDrawUsage !== undefined) {
                asteroidBelt.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            }
            asteroidBelt.frustumCulled = true;
            asteroidBelt.castShadow = false;
            asteroidBelt.receiveShadow = false;
            asteroidBelt.name = 'asteroid-belt';

            const color = new THREE.Color();
            const innerRadius = asteroidBeltConfig.innerDistance;
            const outerRadius = asteroidBeltConfig.outerDistance;
            const bandWidth = outerRadius - innerRadius;
            const thickness = Math.max(bandWidth * 0.11, 1.7);

            for (let i = 0; i < asteroidBeltConfig.count; i++) {
                const radius = THREE.MathUtils.lerp(innerRadius, outerRadius, (Math.random() + Math.random()) * 0.5);
                const normalizedRadius = (radius - innerRadius) / bandWidth;
                let size = THREE.MathUtils.lerp(0.12, 0.3, Math.random());
                if (Math.random() < 0.08) {
                    size *= 1.65;
                }

                asteroidBeltBodies.push({
                    radius,
                    angle: Math.random() * Math.PI * 2,
                    inclination: degreesToRadians((Math.random() - 0.5) * 4.2),
                    ascendingNode: Math.random() * Math.PI * 2,
                    verticalAmplitude: (0.05 + Math.random() * 0.18) * thickness,
                    verticalFrequency: 1.4 + Math.random() * 1.9,
                    verticalPhase: Math.random() * Math.PI * 2,
                    size,
                    speed: THREE.MathUtils.lerp(0.0021, 0.00135, normalizedRadius) * (0.86 + Math.random() * 0.28),
                    spinX: Math.random() * Math.PI * 2,
                    spinY: Math.random() * Math.PI * 2,
                    spinZ: Math.random() * Math.PI * 2,
                    spinSpeed: 0.3 + Math.random() * 0.9
                });

                color.setHSL(0.09 + (Math.random() - 0.5) * 0.018, 0.12 + Math.random() * 0.06, 0.44 + Math.random() * 0.16);
                asteroidBelt.setColorAt(i, color);
            }

            if (asteroidBelt.instanceColor) {
                asteroidBelt.instanceColor.needsUpdate = true;
            }

            const dustCount = solarPerfProfile.dustCount;
            const dustPositions = new Float32Array(dustCount * 3);
            const dustColors = new Float32Array(dustCount * 3);

            for (let i = 0; i < dustCount; i++) {
                const radius = THREE.MathUtils.lerp(innerRadius, outerRadius, (Math.random() + Math.random() + Math.random()) / 3);
                const angle = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * thickness * 0.38;
                const offset = (Math.random() - 0.5) * bandWidth * 0.025;
                const finalRadius = radius + offset;
                const index = i * 3;

                dustPositions[index] = finalRadius * Math.cos(angle);
                dustPositions[index + 1] = y;
                dustPositions[index + 2] = finalRadius * Math.sin(angle);

                color.setHSL(0.095 + (Math.random() - 0.5) * 0.012, 0.1 + Math.random() * 0.05, 0.48 + Math.random() * 0.12);
                dustColors[index] = color.r;
                dustColors[index + 1] = color.g;
                dustColors[index + 2] = color.b;
            }

            const dustGeometry = new THREE.BufferGeometry();
            dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
            dustGeometry.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));

            const dustMaterial = new THREE.PointsMaterial({
                size: 0.46,
                transparent: true,
                opacity: 0.27,
                depthWrite: false,
                sizeAttenuation: true,
                vertexColors: true,
                blending: THREE.AdditiveBlending
            });

            asteroidBeltDust = new THREE.Points(dustGeometry, dustMaterial);
            asteroidBeltDust.renderOrder = 1;

            updateAsteroidBelt(0, 0);
            scene.add(asteroidBeltDust);
            scene.add(asteroidBelt);
        }

        function createGradientTrail(cfg) {
            const minSegments = solarPerfProfile.isHeavyDevice ? 80 : 110;
            const maxSegments = solarPerfProfile.isHeavyDevice ? 200 : 260;
            const segments = Math.max(minSegments, Math.min(maxSegments, Math.round(2 * Math.PI / Math.max(cfg.speed, 0.00025))));
            const pointCount = segments + 1;
            const positions = new Float32Array(pointCount * 3);
            const colors = new Float32Array(pointCount * 3);
            const baseColor = new THREE.Color(cfg.orbitColor || cfg.color || 0xffffff);
            const headColor = baseColor.clone().offsetHSL(0, 0.12, 0.2);
            const tailColor = baseColor.clone().multiplyScalar(0.08);

            for (let i = 0; i < pointCount; i++) {
                const t = i / segments;
                const fade = Math.pow(t, 1.75);
                const color = tailColor.clone().lerp(headColor, fade);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.LineBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.92,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const line = new THREE.Line(geometry, material);
            line.renderOrder = 2;
            scene.add(line);
            return { line, segments, positions, geometry };
        }

        // ★ 复用 Vector3 避免轨道计算 GC
        const _trailWorkVec = new THREE.Vector3();
        function updateGradientTrail(trail, cfg, headAngle) {
            if (!trail || !trail.positions || !trail.geometry) return;
            const positions = trail.positions;
            const segments = trail.segments;

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const angle = headAngle - Math.PI * 2 + t * Math.PI * 2;
                const point = getOrbitPointFast(cfg, angle, _trailWorkVec);
                const idx = i * 3;
                positions[idx] = point.x;
                positions[idx + 1] = point.y;
                positions[idx + 2] = point.z;
            }

            trail.geometry.attributes.position.needsUpdate = true;
        }

        function resetFollowLighting() {
            if (!ambientLight || !followFillLight || !followRimLight) return;
            ambientLight.intensity = 0.4;
            followFillLight.intensity = 0;
            followFillLight.visible = false;
            followRimLight.intensity = 0;
            followRimLight.visible = false;
        }

        // ★ 复用 Vector3 避免跟随光源每帧 GC
        const _lightCenter = new THREE.Vector3();
        const _viewDir = new THREE.Vector3();
        const _sideDir = new THREE.Vector3();
        const _crossTmp = new THREE.Vector3();
        const _heightOff = new THREE.Vector3();
        const _fillOff = new THREE.Vector3();
        const _rimOff = new THREE.Vector3();
        function updateFollowLighting(targetObj, targetName) {
            if (!targetObj || !camera || !ambientLight || !followFillLight || !followRimLight) {
                resetFollowLighting();
                return;
            }

            if (targetName === "太阳") {
                ambientLight.intensity = 0.5;
                followFillLight.intensity = 0;
                followFillLight.visible = false;
                followRimLight.intensity = 0;
                followRimLight.visible = false;
                return;
            }

            const cfg = planetConfig[targetName] || {};
            const focusSize = Math.max(cfg.size || 1, 0.9);
            _lightCenter.copy(targetObj.position);
            _viewDir.copy(camera.position).sub(_lightCenter).normalize();
            _crossTmp.set(0, 1, 0);
            _sideDir.crossVectors(_crossTmp, _viewDir);
            if (_sideDir.lengthSq() < 0.0001) {
                _sideDir.set(1, 0, 0);
            } else {
                _sideDir.normalize();
            }

            _heightOff.set(0, focusSize * 1.4 + 1.6, 0);
            _fillOff.copy(_viewDir).multiplyScalar(focusSize * 4.8 + 3.5).add(_heightOff);
            _rimOff.copy(_sideDir).multiplyScalar(focusSize * 4.2 + 2.4).addScaledVector(_heightOff, 0.55);

            ambientLight.intensity = targetName === "月球" ? 0.68 : 0.78;

            followFillLight.position.copy(_lightCenter).add(_fillOff);
            followFillLight.distance = Math.max(focusSize * 26, 30);
            followFillLight.intensity = targetName === "月球" ? 1.9 : 2.5;
            followFillLight.visible = true;

            followRimLight.position.copy(_lightCenter).add(_rimOff);
            followRimLight.distance = Math.max(focusSize * 30, 36);
            followRimLight.intensity = targetName === "月球" ? 0.9 : 1.2;
            followRimLight.visible = true;
        }

        // 创建太阳
        function createSun() {
            const cfg = planetConfig["太阳"];
            const sunGeometry = new THREE.SphereGeometry(cfg.size, 80, 80);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: cfg.color || 0xffde21 });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(0, 0, 0);
            sun.name = "太阳";

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('/assets/simulation/models/sun.jpg', function(texture) {
                if (texture.encoding !== undefined && THREE.sRGBEncoding !== undefined) {
                    texture.encoding = THREE.sRGBEncoding;
                }
                if (texture.flipY !== undefined) {
                    texture.flipY = false;
                }
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                sun.material.map = texture;
                sun.material.needsUpdate = true;
            });

            // 添加太阳发光光晕
                const glowGeometry = new THREE.SphereGeometry(cfg.size * 1.4, 64, 64);
                const glowMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        'c': { type: 'f', value: 0.7 },
                        'p': { type: 'f', value: 6.0 },
                        glowColor: { type: 'c', value: new THREE.Color(0xffcc66) },
                        viewVector: { type: 'v3', value: camera.position }
                    },
                    vertexShader: `
                        uniform vec3 viewVector;
                        uniform float c;
                        uniform float p;
                        varying float intensity;
                        void main() {
                            vec3 vNormal = normalize(normalMatrix * normal);
                            vec3 vNormel = normalize(normalMatrix * viewVector - modelViewMatrix * vec4(position, 1.0)).xyz;
                            intensity = pow(c - dot(vNormal, vNormel), p);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 glowColor;
                        varying float intensity;
                        void main() {
                            vec3 glow = glowColor * intensity;
                            gl_FragColor = vec4(glow, 1.0);
                        }
                    `,
                    side: THREE.BackSide,
                    blending: THREE.AdditiveBlending,
                    transparent: true
                });
                const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                glowMesh.position.set(0, 0, 0);
                sun.add(glowMesh);
            scene.add(sun);
            planetObjects.push({ mesh: sun, config: cfg, angle: 0 });

            // 标签创建与挂载
            const label = document.createElement('div');
            label.className = 'planet-label';
            label.innerHTML = `
              <div class="planet-name">${cfg.name}</div>
            `;
            document.body.appendChild(label);
            cfg.__labelElement = label;

            label.addEventListener('click', () => {
                startViewTransition(true, cfg.name);
                showPlanetInfo(cfg.name);
            });
        }

        // 创建行星
        function createPlanets() {
            Object.keys(planetConfig).forEach(key => {
                if (key === "\u592a\u9633" || key === "\u6708\u7403" || key === "\u54c8\u96f7\u5f57\u661f") return;
                const cfg = planetConfig[key];
                const initialAngle = Math.random() * Math.PI * 2;
                if (key === "\u5730\u7403") {
                    // ★ 地球使用 SphereGeometry 建模（与地月转移实验方案一致）
                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(cfg.size, 80, 80),
                        new THREE.MeshStandardMaterial({
                            metalness: 0.04,
                            roughness: 0.85,
                            emissive: new THREE.Color(0x111111),
                            emissiveIntensity: 0.35,
                            color: cfg.color || 0x3399ff
                        })
                    );
                    mesh.position.copy(getOrbitPoint(cfg, initialAngle));
                    mesh.name = cfg.name;
                    mesh.castShadow = renderer.shadowMap.enabled;
                    mesh.receiveShadow = renderer.shadowMap.enabled;

                    const earthTexLoader = new THREE.TextureLoader();
                    earthTexLoader.load('/assets/simulation/models/earth.jpg', function(texture) {
                        if (texture.encoding !== undefined && THREE.sRGBEncoding !== undefined) {
                            texture.encoding = THREE.sRGBEncoding;
                        }
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        mesh.material.map = texture;
                        mesh.material.bumpMap = texture;
                        mesh.material.bumpScale = 0.03;
                        mesh.material.needsUpdate = true;
                    });

                    
                    
                    scene.add(mesh);
                    planetObjects.push({ mesh: mesh, config: cfg, angle: initialAngle });

                    mesh.rotation.x = EARTH_AXIAL_TILT;

                    const label = document.createElement('div');
                    label.className = 'planet-label';
                    label.innerHTML = '<div class="planet-name">' + cfg.name + '</div>';
                    document.body.appendChild(label);
                    cfg.__labelElement = label;

                    label.addEventListener('click', function() {
                        startViewTransition(true, cfg.name);
                        showPlanetInfo(cfg.name);
                    });

                    const trail = createGradientTrail(cfg);
                    updateGradientTrail(trail, cfg, initialAngle);
                    const createdObj = planetObjects[planetObjects.length - 1];
                    if (createdObj) {
                        createdObj.trail = trail;
                    }

                    // 月球（地球卫星）— SphereGeometry 建模
                    const moonCfg = planetConfig["\u6708\u7403"];
                    moonObject = new THREE.Mesh(
                        new THREE.SphereGeometry(moonCfg.size, 80, 80),
                        new THREE.MeshStandardMaterial({
                            metalness: 0.04,
                            roughness: 0.85,
                            emissive: new THREE.Color(0x111111),
                            emissiveIntensity: 0.35,
                            color: moonCfg.color || 0xcccccc
                        })
                    );
                    moonObject.position.set(
                        mesh.position.x + moonCfg.distance,
                        mesh.position.y,
                        mesh.position.z
                    );
                    moonObject.name = "\u6708\u7403";
                    moonObject.castShadow = renderer.shadowMap.enabled;
                    moonObject.receiveShadow = renderer.shadowMap.enabled;

                    var moonTextureLoader = new THREE.TextureLoader();
                    moonTextureLoader.load("/assets/simulation/models/moon.jpg", function(texture) {
                        if (texture.encoding !== undefined && THREE.sRGBEncoding !== undefined) {
                            texture.encoding = THREE.sRGBEncoding;
                        }
                        if (texture.flipY !== undefined) {
                            texture.flipY = false;
                        }
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        moonObject.material.map = texture;
                        moonObject.material.bumpMap = texture;
                        moonObject.material.bumpScale = 0.03;
                        moonObject.material.needsUpdate = true;
                    });
                    scene.add(moonObject);

                    var a = moonCfg.distance;
                    var e = moonCfg.eccentricity || 0;
                    var b = a * Math.sqrt(1 - e * e);
                    var moonSegments = 128;
                    var moonOrbitPoints = [];
                    for (var i = 0; i <= moonSegments; i++) {
                        var theta = (i / moonSegments) * Math.PI * 2;
                        var x = a * Math.cos(theta) - a * e;
                        var z = b * Math.sin(theta);
                        moonOrbitPoints.push(new THREE.Vector3(x, 0, z));
                    }
                    moonOrbitObject = null;

                    var moonLabel = document.createElement('div');
                    moonLabel.className = 'planet-label';
                    moonLabel.innerHTML = '<div class="planet-name">' + moonCfg.name + '</div>';
                    document.body.appendChild(moonLabel);
                    moonCfg.__labelElement = moonLabel;

                    moonLabel.addEventListener('click', function() {
                        startViewTransition(true, moonCfg.name);
                        showPlanetInfo(moonCfg.name);
                    });
                } else {
                    // ★ 统一使用 SphereGeometry 建模
                    const planetTextureMap = {
                        "\u6c34\u661f": "/assets/simulation/models/mercury.png",
                        "\u91d1\u661f": "/assets/simulation/models/venus.png",
                        "\u706b\u661f": "/assets/simulation/models/mars.png",
                        "\u6728\u661f": "/assets/simulation/models/jupiter.png",
                        "\u571f\u661f": "/assets/simulation/models/saturn.png",
                        "\u5929\u738b\u661f": "/assets/simulation/models/uranus.png",
                        "\u6d77\u738b\u661f": "/assets/simulation/models/neptune.png"
                    };
                    const texturePath = planetTextureMap[cfg.name];
                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(cfg.size, 80, 80),
                        new THREE.MeshStandardMaterial({
                            metalness: 0.04,
                            roughness: 0.85,
                            emissive: new THREE.Color(0x111111),
                            emissiveIntensity: 0.35,
                            color: cfg.color || 0xffffff
                        })
                    );
                    mesh.name = cfg.name;
                    mesh.castShadow = renderer.shadowMap.enabled;
                    mesh.receiveShadow = renderer.shadowMap.enabled;

                    
                    
                    if (cfg.name === "\u571f\u661f") {
                        tiltGroup = new THREE.Group();
                        tiltGroup.rotation.z = degreesToRadians(26.73);  // 土星自转轴倾斜
                        tiltGroup.add(mesh);
                    }

                    mesh.position.copy(getOrbitPoint(cfg, initialAngle));

                    if (texturePath) {
                        const texLoader = new THREE.TextureLoader();
                        texLoader.load(texturePath, function(tex) {
                            if (tex.encoding !== undefined && THREE.sRGBEncoding !== undefined) tex.encoding = THREE.sRGBEncoding;
                            if (tex.flipY !== undefined) tex.flipY = false;
                            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            mesh.material.map = tex;
                            mesh.material.bumpMap = tex;
                            mesh.material.bumpScale = 0.03;
                            mesh.material.needsUpdate = true;
                        });
                    }

                    
                    
                    scene.add(mesh);
                    planetObjects.push({ mesh: mesh, config: cfg, angle: initialAngle });

                    const label = document.createElement('div');
                    label.className = 'planet-label';
                    label.innerHTML = '<div class="planet-name">' + cfg.name + '</div>';
                    document.body.appendChild(label);
                    cfg.__labelElement = label;

                    label.addEventListener('click', function() {
                        startViewTransition(true, cfg.name);
                        showPlanetInfo(cfg.name);
                    });

                    const trail = createGradientTrail(cfg);
                    updateGradientTrail(trail, cfg, initialAngle);
                    const createdObj = planetObjects[planetObjects.length - 1];
                    if (createdObj) {
                        createdObj.trail = trail;
                    }
                }
            });
        }

function createStars() {
    const starGeo = new THREE.BufferGeometry();
    const starCount = window.innerWidth < 768 ? 520 : window.innerWidth < 1440 ? 760 : 980;
    const positions = [];
    for (let i = 0; i < starCount; i++) {
        const r = 300 + Math.random() * 2700;
        const theta = Math.random() * 2 * Math.PI;
        const phi = Math.acos(2 * Math.random() - 1);
        positions.push(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
        );
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
}

const _labelProjectVec = new THREE.Vector3();
function updatePlanetLabelPositions() {
    planetObjects.forEach(obj => {
        const label = obj.config.__labelElement;
        if (!label) return;
        _labelProjectVec.copy(obj.mesh.position).project(camera);
        const x = (_labelProjectVec.x + 1) / 2 * window.innerWidth;
        const y = (-_labelProjectVec.y + 1) / 2 * window.innerHeight;
        label.style.left = `${x}px`;
        label.style.top = `${y}px`;
        label.style.display = _labelProjectVec.z < 1 ? 'block' : 'none';
    });

    const moonCfg = planetConfig["月球"];
    if (moonObject && moonCfg.__labelElement) {
        _labelProjectVec.copy(moonObject.position).project(camera);
        const x = (_labelProjectVec.x + 1) / 2 * window.innerWidth;
        const y = (-_labelProjectVec.y + 1) / 2 * window.innerHeight;
        moonCfg.__labelElement.style.left = `${x}px`;
        moonCfg.__labelElement.style.top = `${y}px`;
        moonCfg.__labelElement.style.display = _labelProjectVec.z < 1 ? 'block' : 'none';
    }
}

// 动画循环
function animate() {
    requestAnimationFrame(animate);
    solarFrameCount += 1;
    const now = performance.now();
    const delta = clock.getDelta() * (window.timeScale !== undefined ? window.timeScale : 1);
    
    // 处理视角过渡
    if (isTransitioning) {
        const now = Date.now();
        const elapsed = now - transitionStartTime;
        const progress = Math.min(elapsed / transitionDuration, 1);
        
        if (followMode) {
            // ???????
            let targetObj = getTargetObject(followTarget);
            if (targetObj) {
                const targetPos = targetObj.position.clone();

            // 以地球为中心的椭圆轨道
            const a = moonCfg.distance;
            const e = moonCfg.eccentricity || 0;
            const b = a * Math.sqrt(1 - e * e);
            const mx = a * Math.cos(moonAngle) - a * e;
            const mz = b * Math.sin(moonAngle);
            // 直接设置月球位置，避免插值产生误差
            moonObject.position.set(
                earthObj.mesh.position.x + mx,

            );

// 获取目标对象
function getTargetObject(targetName) {
    if (targetName === '月球' && moonObject) {
        return moonObject;
    } else {
        const obj = planetObjects.find(obj => obj.config.name === targetName);
        return obj ? obj.mesh : null;
    }
}

// 计算跟随位置
function getFollowViewConfig(targetName) {
    if (targetName === "\u592a\u9633") {
        return { distance: 6, elevation: 2, azimuth: Math.PI / 4 };
    }
    if (targetName === "\u6708\u7403") {
        return { distance: 0.8, elevation: 0.2, azimuth: Math.PI / 3.8 };
    }
    if (targetName === "\u571f\u661f") {
        return { distance: 12, elevation: 4, azimuth: Math.PI / 4 };  // 土星保持远距离
    }
    return { distance: 2.5, elevation: 1, azimuth: Math.PI / 4 };  // 其他天体靠近
}

function applyFreeViewControls() {
    if (!controls) return;
    controls.enablePan = true;
    controls.minDistance = 0.1;
    controls.maxDistance = 5000;
}

function applyFollowViewControls(targetName) {
    if (!controls) return;

    const cfg = planetConfig[targetName] || {};
    const preset = getFollowViewConfig(targetName);
    const focusSize = Math.max(cfg.size || 1, 0.8);

    controls.enablePan = false;
    controls.minDistance = Math.max(0.35, focusSize * 0.8, preset.distance * 0.45);
    controls.maxDistance = Math.max(10, preset.distance * 9, focusSize * 20);
}

function calculateFollowPosition(targetObj, targetName) {
    const center = targetObj.position.clone();
    const preset = getFollowViewConfig(targetName);

    const camX = center.x + preset.distance * Math.cos(preset.azimuth);
    const camY = center.y + preset.elevation;
    const camZ = center.z + preset.distance * Math.sin(preset.azimuth);

    return new THREE.Vector3(camX, camY, camZ);
}
function startViewTransition(newFollowMode, newTarget) {
    isTransitioning = true;
    transitionStartTime = Date.now();
    followMode = newFollowMode;
    followTarget = newTarget;

    if (controls) {
        controls.enabled = false;
        if (newFollowMode) {
            applyFollowViewControls(newTarget);
        } else {
            applyFreeViewControls();
        }
    }
    
    // ???????????
    originalCameraPos.copy(camera.position);
    originalControlsTarget.copy(controls.target);
}

// ── Skyfield 批量查询 + 自动更新 3D 场景 ────────────────────────
var BODY_KEY_TO_NAME = {
    "mercury": "水星", "venus": "金星", "earth": "地球", "mars": "火星",
    "jupiter": "木星", "saturn": "土星", "uranus": "天王星", "neptune": "海王星",
    "moon": "月球", "sun": "太阳"
};
var KM_TO_SCENE = 1.326e-7;
var resultCollapsed = false;

function toggleResultCollapse() {
    resultCollapsed = !resultCollapsed;
    var body = document.getElementById('horizons-result-body');
    var icon = document.getElementById('horizons-collapse-icon');
    if (body) { body.style.display = resultCollapsed ? 'none' : ''; }
    if (icon) { icon.textContent = resultCollapsed ? '▶' : '▼'; }
}

function querySkyfield() {
    var dateEl = document.getElementById('horizons-date');
    var statusEl = document.getElementById('horizons-status');
    var resultEl = document.getElementById('horizons-result');
    var btn = document.getElementById('horizons-query-btn');
    var date = dateEl ? dateEl.value : '';
    if (!date) { if (statusEl) { statusEl.textContent = '请选择日期'; statusEl.style.color = '#fbbf24'; } return; }
    if (btn) { btn.disabled = true; btn.textContent = '计算中...'; }
    if (statusEl) { statusEl.textContent = '正在计算所有行星位置...'; statusEl.style.color = '#aaa'; }

    fetch('/api/skyfield/?mode=all&center=sun&date=' + encodeURIComponent(date))
        .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(function(data) {
            if (data.error) throw new Error(data.error);
            var bodies = data.bodies || [];
            var updated = 0;
            var rows = '';
            for (var i = 0; i < bodies.length; i++) {
                var b = bodies[i];
                var zhName = BODY_KEY_TO_NAME[b.body_key] || b.body_name_zh;
                var sx = b.x * KM_TO_SCENE, sy = b.y * KM_TO_SCENE, sz = b.z * KM_TO_SCENE;
                for (var j = 0; j < planetObjects.length; j++) {
                    var obj = planetObjects[j];
                    if (obj.config && obj.config.name === zhName) {
                        obj.mesh.position.set(sx, sy, sz);
                        obj.angle = Math.atan2(sx, sz);
                        if (obj.trail) { updateGradientTrail(obj.trail, obj.config, obj.angle); }
                        updated++;
                        break;
                    }
                }
                rows += '<tr><td style="color:#a78bfa;">' + zhName + '</td>' +
                    '<td>' + b.x.toExponential(4) + '</td><td>' + b.y.toExponential(4) + '</td>' +
                    '<td>' + b.z.toExponential(4) + '</td><td>' + b.distance_au.toFixed(4) + ' AU</td></tr>';
            }
            if (statusEl) { statusEl.textContent = '已更新 ' + updated + ' 个天体 · ' + date; statusEl.style.color = '#4ade80'; }
            simDate = new Date(date + 'T12:00:00Z');
            if (simDateEl) { simDateEl.textContent = '' + date; }
            if (resultEl) {
                resultEl.style.display = 'block';
                var titleEl = document.getElementById('horizons-result-title');
                if (titleEl) { titleEl.textContent = data.date + ' · 日心坐标'; }
                var bodyEl = document.getElementById('horizons-result-body');
                if (bodyEl) {
                    bodyEl.innerHTML =
                        '<div style="color:#94a3b8;font-size:11px;margin-bottom:4px;">' + (data.source || 'Skyfield') + '</div>' +
                        '<table style="width:100%;border-collapse:collapse;margin-top:4px;font-size:11px;">' +
                        '<tr style="color:#aaa;"><th style="text-align:left;">天体</th><th>X(km)</th><th>Y(km)</th><th>Z(km)</th><th>日心距</th></tr>' +
                        rows + '</table>';
                }
            }
            showNotification(updated + ' 个天体已同步为 ' + date + ' 真实位置');
        })
        .catch(function(err) {
            if (statusEl) { statusEl.textContent = '错误: ' + err.message; statusEl.style.color = '#f87171'; }
            if (resultEl) { resultEl.style.display = 'none'; }
        })
        .finally(function() { if (btn) { btn.disabled = false; btn.textContent = '查询并更新场景'; } });
}

    const pauseBtn = document.getElementById('pause-btn');
    const minusBtn = document.getElementById('speed-minus');
    const plusBtn = document.getElementById('speed-plus');
    const animSvg = document.getElementById('anim-svg');
    let lastTimeScale = 1;
    let isPaused = false;

    function updatePauseBtnAndAnim() {
        const v = parseFloat(slider.value);
        if (v === 0) {
            isPaused = true;
            pauseBtn.innerText = '▶';
            animSvg.style.animation = '';
        } else {
            isPaused = false;
            pauseBtn.innerText = '⏸';
            animSvg.style.animation = 'spin-anim 1.2s linear infinite';
        }
    }
    
    if (slider && valueSpan && pauseBtn && minusBtn && plusBtn && animSvg) {
        slider.addEventListener('input', () => {
            let v = parseFloat(slider.value);
            window.timeScale = v;
            valueSpan.textContent = v.toFixed(1) + 'x';
            // ★ 记录上次时间流速
            if (v > 0) window._solarLastTimeScale = v;
            updatePauseBtnAndAnim();
        });
        minusBtn.addEventListener('click', () => {
            let v = Math.max(0, parseFloat(slider.value) - 0.1);
            slider.value = v.toFixed(1);
            slider.dispatchEvent(new Event('input'));
        });
        plusBtn.addEventListener('click', () => {
            let v = Math.min(10, parseFloat(slider.value) + 0.1);
            slider.value = v.toFixed(1);
            slider.dispatchEvent(new Event('input'));
        });
        // 暂停/恢复按钮
        pauseBtn.addEventListener('click', () => {
            let v = parseFloat(slider.value);
            if (!isPaused) {
                // 只有主动点击暂停时才记录
                lastTimeScale = v > 0 ? v : (lastTimeScale || 1);
                slider.value = '0';
                slider.dispatchEvent(new Event('input'));
            } else {
                // 恢复到上次非零速度
                slider.value = lastTimeScale.toFixed(1);
                slider.dispatchEvent(new Event('input'));
            }
        });
        // 初始化
        window.timeScale = parseFloat(slider.value);
        updatePauseBtnAndAnim();
    }
});
const style = document.createElement('style');
style.textContent = `@keyframes spin-anim { 100% { transform: rotate(360deg); } }`;
document.head.appendChild(style);

$(function () {
    const infoToggleBtn = document.getElementById('planet-info-toggle');
    if (infoToggleBtn) {
        infoToggleBtn.addEventListener('click', toggleInfoPanelCollapsed);
    }
    applyInfoPanelCollapsedState();

    const $selectRow = $('#planet-select-row');
    const $select = $('#planet-select');

    $('input[name="viewmode"]').on('change', function () {
        const newFollowMode = $(this).val() === 'follow';
        followMode = newFollowMode;
        followTarget = $select.val();
        startViewTransition(newFollowMode, followTarget);
        $selectRow.toggle(newFollowMode);
    });

    $select.on('change', function () {
        if (followMode) {
            followTarget = this.value;
            startViewTransition(true, followTarget);
            showPlanetInfo(followTarget);
        }
    });

    followMode = $('input[name="viewmode"]:checked').val() === 'follow';
    followTarget = $select.val();
    $selectRow.toggle(followMode);

    // Skyfield 查询初始化
    var today = new Date();
    var dateEl = document.getElementById('horizons-date');
    if (dateEl) { dateEl.value = today.toISOString().split('T')[0]; }
    var queryBtn = document.getElementById('horizons-query-btn');
    if (queryBtn) { queryBtn.addEventListener('click', querySkyfield); }
});
</script>
