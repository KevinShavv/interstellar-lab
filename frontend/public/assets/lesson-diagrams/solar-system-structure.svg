<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <defs>
    <linearGradient id="orbitLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ab4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6a86c7" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sunBody" cx="34%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="52%" stop-color="#ffd57a"/>
      <stop offset="100%" stop-color="#cc7f2d"/>
    </radialGradient>
    <radialGradient id="mercuryBody" cx="32%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#e4e8ef"/>
      <stop offset="100%" stop-color="#6e788a"/>
    </radialGradient>
    <radialGradient id="venusBody" cx="34%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#ffe5bf"/>
      <stop offset="100%" stop-color="#bc7a46"/>
    </radialGradient>
    <radialGradient id="marsBody" cx="34%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#ffc8b2"/>
      <stop offset="100%" stop-color="#a64731"/>
    </radialGradient>
    <filter id="sphereShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#030712" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g fill="none" stroke="url(#orbitLine)" stroke-width="2.2">
    <ellipse cx="290" cy="280" rx="112" ry="72"/>
    <ellipse cx="290" cy="280" rx="168" ry="108"/>
    <ellipse cx="290" cy="280" rx="238" ry="152"/>
  </g>

  <circle cx="290" cy="280" r="58" fill="url(#sunBody)" filter="url(#sphereShadow)"/>
  <circle cx="400" cy="280" r="10" fill="url(#mercuryBody)" filter="url(#sphereShadow)"/>
  <circle cx="454" cy="236" r="12" fill="url(#venusBody)" filter="url(#sphereShadow)"/>
  <circle cx="526" cy="346" r="14" fill="url(#marsBody)" filter="url(#sphereShadow)"/>

  <path d="M606 174h268" stroke="#7ea6ef" stroke-width="2"/>
  <text x="606" y="142" fill="#e8f0ff" font-size="38" font-weight="700" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">太阳系层级结构</text>
  <text x="606" y="202" fill="#c8d8ff" font-size="29" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">内层轨道半径较小，公转周期较短</text>
  <text x="606" y="244" fill="#c8d8ff" font-size="29" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">外层轨道半径较大，公转周期较长</text>
  <text x="606" y="304" fill="#d7e4ff" font-size="46" font-family="'Times New Roman',serif" font-style="italic">T² ∝ r³</text>

  <text x="248" y="288" fill="#f4f5f7" font-size="24" font-weight="700" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">太阳</text>
  <text x="382" y="258" fill="#dfeaff" font-size="24" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">内行星</text>
  <text x="536" y="384" fill="#dfeaff" font-size="24" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">外行星</text>
</svg>
