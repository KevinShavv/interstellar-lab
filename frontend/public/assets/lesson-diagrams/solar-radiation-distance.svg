<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <defs>
    <linearGradient id="ray1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe8a7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe8a7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ray2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe8a7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffe8a7" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="sunBody" cx="34%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="52%" stop-color="#ffd57a"/>
      <stop offset="100%" stop-color="#cc7f2d"/>
    </radialGradient>
    <radialGradient id="earthBody" cx="34%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#a4d2ff"/>
      <stop offset="55%" stop-color="#4b85d8"/>
      <stop offset="100%" stop-color="#1b3a70"/>
    </radialGradient>
    <filter id="sphereShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#030712" flood-opacity="0.38"/>
    </filter>
  </defs>

  <circle cx="146" cy="280" r="62" fill="url(#sunBody)" filter="url(#sphereShadow)"/>
  <circle cx="430" cy="280" r="20" fill="url(#earthBody)" filter="url(#sphereShadow)"/>
  <circle cx="730" cy="280" r="20" fill="url(#earthBody)" filter="url(#sphereShadow)"/>

  <line x1="208" y1="280" x2="410" y2="280" stroke="#a6c3ff" stroke-width="3.2"/>
  <line x1="450" y1="280" x2="710" y2="280" stroke="#6f8ecf" stroke-width="2.4"/>
  <text x="302" y="258" fill="#d8e5ff" font-size="29" font-family="'Times New Roman',serif" font-style="italic">r</text>
  <text x="576" y="258" fill="#d8e5ff" font-size="29" font-family="'Times New Roman',serif" font-style="italic">2r</text>

  <path d="M220 234h210" stroke="url(#ray1)" stroke-width="12" stroke-linecap="round"/>
  <path d="M220 326h510" stroke="url(#ray2)" stroke-width="12" stroke-linecap="round"/>

  <g fill="#e8f0ff" font-size="46" font-family="'Times New Roman',serif" font-style="italic">
    <text x="494" y="140">I ∝</text>
    <text x="612" y="126" text-anchor="middle">1</text>
    <line x1="586" y1="132" x2="638" y2="132" stroke="#e8f0ff" stroke-width="2"/>
    <text x="612" y="160" text-anchor="middle">r²</text>
  </g>
  <text x="494" y="182" fill="#c9d8ff" font-size="29" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">距离越远，单位面积接收辐射越弱</text>
  <text x="382" y="322" fill="#dfeaff" font-size="24" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">辐射强</text>
  <text x="686" y="322" fill="#dfeaff" font-size="24" font-family="'Times New Roman','PingFang SC','Microsoft YaHei',sans-serif">辐射弱</text>
</svg>
